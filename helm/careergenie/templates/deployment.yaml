apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: careergenie

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: careergenie

  template:
    metadata:
      labels:
        app: careergenie

    spec:
      containers:
        - name: careergenie
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.containerPort }}
